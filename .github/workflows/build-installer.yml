name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Convert icon.png to icon.ico
        run: |
          python -c "from PIL import Image; img = Image.open('icon.png'); img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --name="PLIP Studio" plip_studio.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          $iss = @"
          [Setup]
          AppName=PLIP Studio
          AppVersion=2.0.1
          DefaultDirName={autopf}\PLIP Studio
          DefaultGroupName=PLIP Studio
          OutputDir=$ws\installer
          OutputBaseFilename=PLIP_Studio_Setup_v2.0.1
          SetupIconFile=$ws\icon.ico
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "$ws\dist\PLIP Studio.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$ws\icon.ico"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\PLIP Studio"; Filename: "{app}\PLIP Studio.exe"; IconFilename: "{app}\icon.ico"
          Name: "{autodesktop}\PLIP Studio"; Filename: "{app}\PLIP Studio.exe"; IconFilename: "{app}\icon.ico"

          [Run]
          Filename: "{app}\PLIP Studio.exe"; Description: "Launch PLIP Studio"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Out-File -FilePath installer_setup.iss -Encoding UTF8
          Write-Host "=== installer_setup.iss created ==="
          Get-Content installer_setup.iss

      - name: Compile installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_setup.iss

      - name: List installer folder
        run: dir installer

      - name: Upload installer to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/PLIP_Studio_Setup_v2.0.1.exe
