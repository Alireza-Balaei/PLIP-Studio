name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow plip openbabel lxml pymol-open-source

      - name: Convert PNG to ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('icon.png')
          img.save('icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          "

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=icon.ico --name="PLIP Studio" --hidden-import=plip --hidden-import=openbabel --hidden-import=lxml --hidden-import=pymol plip_studio.py

      - name: Create Inno Setup script
        run: |
          @'
          [Setup]
          AppName=PLIP Studio
          AppVersion=2.0.1
          DefaultDirName={autopf}\PLIP Studio
          DefaultGroupName=PLIP Studio
          OutputDir=installer
          OutputBaseFilename=PLIP_Studio_Setup_v2.0.1
          SetupIconFile=icon.ico
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "dist\PLIP Studio.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "icon.ico"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\PLIP Studio"; Filename: "{app}\PLIP Studio.exe"; IconFilename: "{app}\icon.ico"
          Name: "{autodesktop}\PLIP Studio"; Filename: "{app}\PLIP Studio.exe"; IconFilename: "{app}\icon.ico"
          '@ | Out-File -Encoding UTF8 installer_setup.iss

      - name: Compile Installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer_setup.iss

      - name: Upload Installer to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/PLIP_Studio_Setup_v2.0.1.exe
